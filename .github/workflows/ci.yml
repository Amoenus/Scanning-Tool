name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install uv
      - run: uv sync
      - run: uv run --managed-python --with-requirements requirements-dev.txt -- pre-commit run --all-files
      - run: uv run --managed-python --with-requirements requirements-dev.txt -- ruff check ./src ./tests
      - run: uv run --managed-python --with-requirements requirements-dev.txt -- mypy src
      - run: uv run --managed-python --with-requirements requirements-dev.txt -- pytest -q tests

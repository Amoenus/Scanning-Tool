<!doctype html>
<html lang="en" xml:lang="en">
<head>
  <title>Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#02050f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='overlay.css') }}">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="overlay-actions fixed right-4 top-4 z-50 flex flex-wrap items-center justify-end gap-2 rounded-full border border-slate-700/80 bg-slate-950/85 px-2 py-2 shadow-[0_12px_30px_rgba(15,23,42,0.35)] backdrop-blur-xl">
    <button id="fullscreen-toggle" type="button" class="action-button inline-flex items-center justify-center rounded-full border border-slate-700/80 bg-slate-900/80 px-3 py-2 text-[11px] font-semibold uppercase tracking-[0.18em] text-slate-300 transition duration-200 hover:border-sky-300/40 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-300/80 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
      Fullscreen
    </button>
    <button id="install-pwa" type="button" class="action-button hidden inline-flex items-center justify-center rounded-full border border-slate-700/80 bg-slate-900/80 px-3 py-2 text-[11px] font-semibold uppercase tracking-[0.18em] text-slate-300 transition duration-200 hover:border-sky-300/40 hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-300/80 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
      Install
    </button>
  </div>
  <div class="min-h-screen flex items-center justify-center p-4">
    <main class="hud-overlay relative w-full max-w-[420px] rounded-[26px] border border-sky-400/20 bg-slate-950/80 p-5 shadow-[0_16px_45px_rgba(23,122,178,0.45)] backdrop-blur-xl">
      <div class="relative space-y-4">
        <section class="space-y-3">
          <div class="space-y-2">
            <div>
              <h1 id="name" class="text-3xl font-semibold uppercase tracking-[0.3em] text-white drop-shadow-[0_0_12px_rgba(94,229,255,0.65)]">No code</h1>
              <p id="code" class="mt-2 text-sm uppercase tracking-[0.24em] text-slate-200/80"></p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <p id="category" class="rounded-full bg-slate-900/80 px-3 py-1 text-[11px] uppercase tracking-[0.22em] text-slate-300"></p>
              <p id="raw" class="text-xs leading-5 text-slate-300/75"></p>
            </div>
          </div>
        </section>

        <section class="flex min-h-[56px] items-center justify-center rounded-full border border-sky-400/20 bg-slate-900/70 px-3 py-2 shadow-inner shadow-sky-400/10">
          <fieldset class="flex w-full items-center justify-center">
            <legend class="sr-only">Select scan region</legend>
            <div class="flex flex-wrap items-center justify-center gap-2">
              {% for region in region_options %}
              <label class="inline-flex items-center">
                <input class="sr-only peer" type="radio" name="region" value="{{ region }}" {{ "checked" if region == default_region else "" }}>
                <span class="inline-flex h-11 min-h-[44px] items-center justify-center rounded-full border border-transparent bg-slate-900/70 px-4 text-xs font-semibold uppercase tracking-[0.22em] text-slate-300 transition duration-200 hover:border-sky-300/40 hover:text-white peer-checked:border-sky-500/80 peer-checked:bg-sky-500/20 peer-checked:text-white peer-focus-visible:border-sky-300/80 peer-focus-visible:ring-2 peer-focus-visible:ring-sky-300/80 peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-slate-950 focus-visible:outline-none">
                  {{ region.title() }}
                </span>
              </label>
              {% endfor %}
            </div>
          </fieldset>
        </section>

        <section id="status-container">
          <div id="status-message" class="hud-status" role="status" aria-live="polite">
            Waiting for overlay data…
          </div>
          <p id="updated-at" class="mt-2 text-[11px] uppercase tracking-[0.22em] text-slate-400"></p>
        </section>

        <section id="minerals" class="hud-table"></section>

        <div class="flex flex-wrap justify-center gap-2 text-[11px] uppercase tracking-[0.22em] text-slate-300/80">
          <span class="rounded-full bg-[#E88AFF]/15 px-3 py-1 font-semibold text-[#E88AFF]">Highest</span>
          <span class="rounded-full bg-[#63E64C]/15 px-3 py-1 font-semibold text-[#63E64C]">High</span>
          <span class="rounded-full bg-[#E6E14C]/15 px-3 py-1 font-semibold text-[#E6E14C]">Medium</span>
          <span class="rounded-full bg-[#E69E4C]/15 px-3 py-1 font-semibold text-[#E69E4C]">Low</span>
        </div>

        <p class="text-xs text-slate-400">Tip: open this overlay on another device (phone or tablet) using your local network link.</p>
      </div>
    </main>
  </div>
  <script src="{{ url_for('static', filename='overlay.js') }}"></script>
</body>
</html>

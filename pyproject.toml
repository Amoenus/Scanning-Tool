[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orca"
version = "1.0.0"
description = "ORCA: Star Citizen ore signature translator with OCR and overlay"
requires-python = ">=3.14"
dependencies = [
    "blinker>=1.9.0",
    "flask>=3.1.3",
    "keyboard>=0.13.5",
    "loguru>=0.7.3",
    "mss>=10.2.0",
    "numpy>=2.2.6",
    "ollama>=0.6.1",
    "opencv-python>=4.13.0.92",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "playwright>=1.58.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyqt6>=6.11.0",
    "tenacity>=9.1.4",
    "waitress>=3.0.2",
]

[project.scripts]
scanning-tool = "scanning_tool.main:main"
orca = "scanning_tool.main:main"

[project.optional-dependencies]
tests = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/scanning_tool"]
include = ["src/scanning_tool/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
exclude = "^src/"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pandas-stubs>=2.3.3.260113",
    "pylance>=4.0.1",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "types-keyboard>=0.13.2.20260408",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scanning-tool"
version = "1.0.0"
description = "Star Citizen deposit scanner with OCR and overlay"
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "opencv-python",
    "numpy",
    "mss",
    "flask",
    "keyboard",
    "ollama",
    "pydantic",
    "loguru",
    "pandas",
]

[project.scripts]
scanning-tool = "scanning_tool.main:main"

[project.optional-dependencies]
tests = ["pytest"]
dev = ["pytest", "mypy", "pandas-stubs", "types-keyboard"]

[tool.hatch.build.targets.wheel]
packages = ["src/scanning_tool"]

[tool.uv]
dependencies = []
dev-dependencies = ["pytest", "mypy", "pandas-stubs", "types-keyboard"]
tools = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

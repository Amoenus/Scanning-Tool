[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orca"
version = "1.0.0"
description = "ORCA: Star Citizen ore signature translator with OCR and overlay"
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "opencv-python",
    "numpy",
    "mss",
    "flask",
    "keyboard",
    "ollama",
    "pydantic",
    "pydantic-settings",
    "tenacity",
    "loguru",
    "playwright>=1.44.0",
    "pandas",
    "waitress>=3.0.2",
    "pyqt6>=6.6.0",
    "blinker>=1.9.0",
]

[project.scripts]
scanning-tool = "scanning_tool.main:main"
orca = "scanning_tool.main:main"

[project.optional-dependencies]
tests = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/scanning_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
exclude = "^src/"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mypy>=1.20.1",
    "pandas-stubs",
    "types-keyboard",
    "ruff>=0.15.11",
    "vulture>=2.16",
    "pylance>=4.0.0",
    "pyright>=1.1.408",
]
